
name: Test Paratera Streaming

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install OpenAI SDK
        run: pip install -q openai

      - name: Test Paratera Streaming
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ vars.PARATERA_BASE_URL }}
          PARATERA_MODEL: ${{ vars.PARATERA_MODEL }}
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["PARATERA_API_KEY"],
              base_url=os.environ["PARATERA_BASE_URL"],
              max_retries=0,
              timeout=90,
          )

          model = os.environ["PARATERA_MODEL"]
          parts = []
          finish_reason = None
          usage = None
          content_chunks = 0

          print("Testing Paratera streaming...", flush=True)
          print("Model:", model, flush=True)

          with client.chat.completions.create(
              model=model,
              messages=[
                  {
                      "role": "user",
                      "content": "请计算17乘19，只回复最终数字。"
                  }
              ],
              reasoning_effort="max",
              extra_body={"thinking": {"type": "enabled"}},
              stream=True,
              stream_options={"include_usage": True},
              max_tokens=512,
          ) as stream:
              for chunk in stream:
                  if getattr(chunk, "usage", None) is not None:
                      usage = chunk.usage

                  if not chunk.choices:
                      continue

                  choice = chunk.choices[0]
                  piece = getattr(choice.delta, "content", None)

                  if piece:
                      parts.append(piece)
                      content_chunks += 1

                  if choice.finish_reason is not None:
                      finish_reason = choice.finish_reason

          result = "".join(parts).strip()

          print("Response:", result)
          print("Content chunks:", content_chunks)
          print("Finish reason:", finish_reason)
          print("Usage:", usage)

          if finish_reason != "stop":
              raise SystemExit("FAILED: stream incomplete")

          if result != "323":
              raise SystemExit("FAILED: unexpected response")

          print("STREAMING TEST PASSED")
          PY
